<style>
  :root {
    --bg: #eaf6ff; --card: #fffdf8; --ink: #4a3b36; --muted: #8a7a72; --line: #eadfd6;
    --brand: #2e9bea; --brand-dark: #1b7cc4; --brand-soft: #d9eefe; --accent: #e94b57; --accent-soft: #fde3e5;
    --blush: #f9b9c6; --ok: #2f9e5b; --ok-soft: #dcf5e6; --warn: #c27a12; --warn-soft: #fff1d6; --info: #2e6fd1; --info-soft: #e1ebff;
    --pm: #f47b20; --fse: #374151; --prs: #ff3333;
    --r: 20px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 600 16px/1.4 "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(84px + var(--safe-b)); min-height: 100vh;
    background-image: radial-gradient(#d3ebfd 1.6px, transparent 1.6px); background-size: 22px 22px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 12px;
    display: flex; align-items: center; gap: 10px; border-bottom: 3px solid var(--ink); }
  header .logo { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 2px 0 rgba(74,59,54,.35)); }
  header h1 { font-size: 19px; margin: 0; font-weight: 900; letter-spacing: -.01em; }
  header .hi { font-size: 13px; opacity: .92; }
  main { padding: 14px 16px 70px; max-width: 720px; margin: 0 auto; }
  .card { background: var(--card); border: 2.5px solid var(--ink); border-radius: var(--r); padding: 14px; margin-bottom: 14px; box-shadow: 0 4px 0 rgba(74,59,54,.18); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .right { text-align: right; }
  .center { text-align: center; }
  h2 { font-size: 17px; margin: 2px 0 10px; font-weight: 900; }
  h3 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 700; }
  input, select, textarea { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 2px solid var(--line);
    border-radius: 14px; background: #fff; color: var(--ink); appearance: none; -webkit-appearance: none; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  textarea { min-height: 60px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
  input:disabled, select:disabled, textarea:disabled { background: #f6f1ec; color: var(--muted); }
  .amount { font-size: 36px; font-weight: 900; text-align: center; padding: 8px; letter-spacing: -.02em; }
  button { font: inherit; font-weight: 800; border: 2.5px solid var(--ink); border-radius: 14px; padding: 10px 14px; cursor: pointer;
    background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--ink); transition: transform .05s; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  button.primary { background: var(--brand); color: #fff; }
  button.red { background: var(--accent); color: #fff; }
  button.danger { background: var(--accent-soft); color: var(--accent); }
  button.ghost { background: transparent; color: var(--brand-dark); border: 0; box-shadow: none; padding: 6px 8px; }
  button.block { width: 100%; padding: 14px; font-size: 17px; }
  button:disabled { opacity: .45; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 5px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 2px solid var(--ink); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 14px; box-shadow: 0 2px 0 var(--ink); }
  .chip.on { background: var(--ink); color: #fff; }
  .seg { display: flex; background: var(--brand-soft); border: 2px solid var(--ink); border-radius: 16px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; background: transparent; color: var(--ink); padding: 8px 4px; border: 2px solid transparent; box-shadow: none; border-radius: 12px; font-size: 14px; }
  .seg button.on { background: #fff; box-shadow: 0 2px 0 var(--ink); border-color: var(--ink); }
  .badge { display: inline-block; font-size: 11px; font-weight: 900; padding: 3px 7px; border-radius: 8px; color: #fff; letter-spacing: .03em; flex: none; }
  .b-PM { background: var(--pm); } .b-FSE { background: var(--fse); } .b-PRS { background: var(--prs); }
  .pill { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; display: inline-block; margin-top: 2px; }
  .s-belum { background: var(--warn-soft); color: var(--warn); }
  .s-dah { background: var(--info-soft); color: var(--info); }
  .s-bayar { background: var(--ok-soft); color: var(--ok); }
  .item { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-top: 2px dashed var(--line); cursor: pointer; }
  .item:first-of-type { border-top: 0; }
  .item .amt { font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .t { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ico { width: 16px; height: 16px; vertical-align: -2px; }
  .total { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 8px 4px; border-top: 2px dashed var(--line); text-align: left; }
  th { font-size: 12px; color: var(--muted); font-weight: 800; border-top: 0; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--card); border-top: 3px solid var(--ink);
    display: flex; padding-bottom: var(--safe-b); }
  nav button { flex: 1; background: transparent; color: var(--muted); border: 0; box-shadow: none; border-radius: 0; padding: 8px 0 9px;
    font-size: 11px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button:active { transform: none; box-shadow: none; }
  nav button svg { width: 24px; height: 24px; }
  nav button.on { color: var(--brand-dark); }
  .fab { position: fixed; right: 18px; bottom: calc(92px + var(--safe-b)); z-index: 7; width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 36px; line-height: 1; padding: 0; font-weight: 900; box-shadow: 0 4px 0 var(--ink); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(74,59,54,.45); z-index: 20; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-top: 3px solid var(--ink); border-radius: 26px 26px 0 0;
    max-height: 94vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px calc(24px + var(--safe-b)); display: none; max-width: 720px; margin: 0 auto; }
  .sheet .grab { width: 44px; height: 6px; background: var(--ink); opacity: .25; border-radius: 3px; margin: 4px auto 8px; }
  .open .sheet, .open .sheet-bg { display: block; }
  .photo { border: 2.5px dashed var(--brand); border-radius: var(--r); background: #fff; text-align: center; padding: 16px; color: var(--brand-dark); font-weight: 800; position: relative; }
  .photo img { max-width: 100%; max-height: 220px; border-radius: 12px; display: block; margin: 0 auto 8px; }
  .photo input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(170px + var(--safe-b)); background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 14px; z-index: 40; font-size: 14px; max-width: 90vw; display: none; text-align: center; }
  .loading { position: fixed; inset: 0; background: rgba(234,246,255,.9); z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; font-weight: 800; }
  .loading .cat { width: 90px; height: 80px; animation: bob 0.9s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-10px) rotate(-4deg); } }
  .empty { text-align: center; color: var(--muted); padding: 18px 10px 8px; }
  .empty .cat { width: 120px; height: 104px; display: block; margin: 0 auto 6px; }
  .bigcat .cat { width: 120px; height: 104px; }
  .midcat .cat { width: 64px; height: 56px; flex: none; }
  .lock { background: var(--info-soft); color: var(--info); padding: 10px 12px; border-radius: 14px; font-size: 14px; margin: 8px 0; border: 2px solid var(--info); }
  .note { background: var(--brand-soft); padding: 10px 12px; border-radius: 14px; font-size: 13px; border: 2px dashed var(--brand); }
  input[type=checkbox].check { width: 24px; height: 24px; flex: none; padding: 0; accent-color: var(--brand); appearance: auto; -webkit-appearance: checkbox; }
  .hidden { display: none !important; }
  #login { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background-image: radial-gradient(#d3ebfd 1.6px, transparent 1.6px); background-size: 22px 22px; }
  #login .card { max-width: 380px; width: 100%; text-align: center; padding: 26px 18px; }
  #login .cat { width: 130px; height: 113px; display: block; margin: 0 auto 4px; }
  #login h2 { margin: 6px 0 4px; font-size: 24px; font-weight: 900; }
  #gbtn { display: flex; justify-content: center; min-height: 44px; margin: 16px 0 6px; }
  #loginMsg { color: var(--accent); margin-top: 8px; }
  a { color: var(--brand-dark); }
  /* Kucing jalan-jalan */
  #walker { position: fixed; left: 0; bottom: calc(53px + var(--safe-b)); z-index: 4; width: 84px; height: 62px; pointer-events: none; will-change: transform; }
  #walker.off { display: none; }
  #walker svg { width: 84px; height: 62px; pointer-events: auto; cursor: pointer; overflow: visible; }
  #walker.left svg { transform: scaleX(-1); }
  #walker .leg { transform-box: fill-box; transform-origin: 50% 15%; }
  #walker.walking .l1, #walker.walking .l4 { animation: step .5s ease-in-out infinite; }
  #walker.walking .l2, #walker.walking .l3 { animation: step .5s ease-in-out infinite; animation-delay: -.25s; }
  #walker.walking .bod { animation: wbob .25s ease-in-out infinite alternate; }
  #walker .tail { transform-box: view-box; transform-origin: 32px 54px; animation: wag 1.6s ease-in-out infinite alternate; }
  #walker.sit .tail { animation-duration: .7s; }
  #walker.jump svg { animation: hop .5s ease-out; }
  #walker.jump.left svg { animation: hopl .5s ease-out; }
  @keyframes step { 0% { transform: rotate(22deg); } 50% { transform: rotate(-22deg); } 100% { transform: rotate(22deg); } }
  @keyframes wbob { from { transform: translateY(0); } to { transform: translateY(-2px); } }
  @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(16deg); } }
  @keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-26px); } 100% { transform: translateY(0); } }
  @keyframes hopl { 0% { transform: scaleX(-1) translateY(0); } 40% { transform: scaleX(-1) translateY(-26px); } 100% { transform: scaleX(-1) translateY(0); } }
  #walker .say { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%) scale(0); transform-origin: 50% 100%; white-space: nowrap;
    background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; padding: 3px 10px; font-size: 13px; font-weight: 900; transition: transform .2s; }
  #walker .say::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; border: 6px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
  #walker .say.show { transform: translateX(-50%) scale(1); }
  .paw { position: fixed; z-index: 3; width: 12px; height: 12px; pointer-events: none; opacity: .3; animation: pawfade 2.6s ease-out forwards; }
  @keyframes pawfade { to { opacity: 0; } }
  .heart { position: fixed; z-index: 30; pointer-events: none; font-size: 20px; color: var(--accent); animation: rise 1.2s ease-out forwards; }
  @keyframes rise { from { transform: translateY(0) scale(.6); opacity: 1; } to { transform: translateY(-70px) scale(1.2); opacity: 0; } }
  .bubble { display: inline-block; background: #fff; border: 2.5px solid var(--ink); border-radius: 16px; padding: 6px 12px; font-weight: 800; margin-bottom: 6px; }
</style>

/* Baca resit automatik: isi cadangan merchant, amaun, tarikh, no. resit (pengguna semak sebelum simpan) */
function scanResit() {
  if (!F || F.Jenis !== 'Resit' || !F._file) return;
  var f = F, file = F._file;
  f._scan = 'baca'; renderForm();
  catSay('Jap, saya baca resit ni...', 2500);
  api('apiScanResit', { mimeType: file.mimeType, data: file.data }).then(function (r) {
    if (F !== f || f._file !== file) return; // borang dah ditutup / fail ditukar
    var isi = [];
    if (r.amaun && !(Number(f.Amaun) > 0)) { f.Amaun = r.amaun; isi.push('amaun'); }
    if (r.merchant && !f.Butiran) { f.Butiran = r.merchant; isi.push('kedai'); }
    if (r.noResit && !f.NoResit) { f.NoResit = r.noResit; isi.push('no. resit'); }
    if (r.tarikh && !f.ID && !f._tarikhUbah) { f.Tarikh = r.tarikh; isi.push('tarikh'); }
    f._scan = isi.length ? 'ok' : 'tiada';
    f._scanIsi = isi;
    renderForm();
    if (isi.length) { toast('Resit dibaca. Sila semak ' + isi.join(', ') + ' ya.', 3500); meowSound(1.2); }
  }).catch(function (e) {
    if (F !== f) return;
    f._scan = 'gagal'; renderForm(); console.warn('scan', e);
  });
}
function readB64(file) {
  return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(String(fr.result).split(',')[1]); }; fr.onerror = rej; fr.readAsDataURL(file); });
}
function loadImg(src) {
  return new Promise(function (res, rej) { var img = new Image(); img.onload = function () { res(img); }; img.onerror = function () { rej(new Error('Tidak dapat baca gambar')); }; img.src = src; });
}
function compressImage(file, max, q) {
  var url = URL.createObjectURL(file);
  return loadImg(url).then(function (img) { URL.revokeObjectURL(url); return drawToJpeg(img, max, q, false); });
}
function drawToJpeg(img, max, q, gray) {
  var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
  var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  if (gray) {
    var id = x.getImageData(0, 0, c.width, c.height), p = id.data;
    for (var i = 0; i < p.length; i += 4) { var v = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]; p[i] = p[i + 1] = p[i + 2] = v; }
    x.putImageData(id, 0, 0);
  }
  return c.toDataURL('image/jpeg', q);
}

function saveForm() {
  var r = F;
  if (r.Jenis === 'Resit') {
    if (!(Number(r.Amaun) > 0)) return toast('Masukkan amaun dulu ya.');
    if (!r._file && !r.ResitUrl) return toast('Resit wajib. Ambil gambar atau pilih fail.');
  } else {
    if (!r.Butiran) return toast('Masukkan tujuan perjalanan.');
    if (!r.Dari || !r.Ke) return toast('Isi alamat Dari dan Ke.');
    if (!(Number(r.KmSehala) > 0)) return toast('Masukkan km sehala.');
  }
  if (r._menyimpan) return; // elak tekan dua kali
  var payload = {};
  ['ID', 'Jenis', 'Tarikh', 'Entiti', 'Kategori', 'EmelClaimant', 'Amaun', 'NoResit', 'Butiran', 'Projek', 'Dari', 'Ke', 'KmSehala', 'DuaHala', 'Nota'].forEach(function (k) { payload[k] = r[k]; });
  payload._bukaKunci = !!r._bukaKunci;
  if (!r.ID) payload.KunciHantar = r._kunci;
  store('entiti', r.Entiti); if (r.Jenis === 'Resit') store('kategori', r.Kategori); if (r.Dari) store('dari', r.Dari);
  r._menyimpan = true;
  busy(true, r._file ? 'Memuat naik resit...' : 'Menyimpan...');
  api('apiSaveRecord', payload, r._file || null).then(function (saved) {
    r._menyimpan = false;
    var ulang = saved._ulang; delete saved._ulang;
    var i = S.d.rekod.findIndex(function (x) { return x.ID === saved.ID; });
    if (i >= 0) S.d.rekod[i] = saved; else S.d.rekod.push(saved);
    busy(false); closeSheet(); renderAll();
    toast(ulang ? 'Rekod ini memang dah disimpan tadi ✔ (tiada double)' : 'Disimpan ' + rm(saved.Amaun) + ' ✔', ulang ? 4000 : 2600);
    catSay('Yay! Resit selamat~'); meowSound(1.15);
  }).catch(function (e) {
    r._menyimpan = false;
    busy(false);
    if (e && e.auth) return;
    if (F !== r) return fail(e);
    // Rangkaian putus: rekod MUNGKIN sudah masuk. Simpan semula selamat kerana kunci hantaran sama.
    r._ralat = (e && e.message ? e.message + ' ' : '') + (r.ID ? 'Sila cuba lagi.' :
      'Rekod mungkin sudah tersimpan. Tekan "Cuba simpan semula": app akan semak dan tidak akan buat rekod double.');
    renderForm();
    var el = $('fRalat'); if (el) el.scrollIntoView({ block: 'center' });
    toast('Belum pasti disimpan. Sila semak mesej dalam borang.', 4000);
  });
}
function delRecord(id) {
  if (!confirm('Padam rekod ini? Resit akan dipindah ke Trash Drive (boleh pulih dalam 30 hari).')) return;
  busy(true, 'Memadam...');
  api('apiDeleteRecord', id).then(function () {
    S.d.rekod = S.d.rekod.filter(function (x) { return x.ID !== id; });
    busy(false); closeSheet(); renderAll(); toast('Dipadam');
  }).catch(fail);
}
function markPaid(ids) {
  var t = prompt('Tarikh dibayar (YYYY-MM-DD):', S.d.today);
  if (!t) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(t)) return toast('Format tarikh salah.');
  busy(true, 'Mengemas kini...');
  api('apiSetStatus', ids, 'Dibayar', t).then(function () {
    S.d.rekod.forEach(function (r) { if (ids.indexOf(r.ID) >= 0) { r.Status = 'Dibayar'; r.TarikhBayar = t; } });
    busy(false); closeSheet(); renderAll(); toast(ids.length + ' rekod ditanda Dibayar');
  }).catch(fail);
}
function revertStatus(id) {
  if (!confirm('Kembalikan rekod ini ke "Belum claim"? No rujukan borang akan dibuang daripada rekod ini.')) return;
  busy(true);
  api('apiSetStatus', [id], 'Belum claim').then(function () {
    S.d.rekod.forEach(function (r) { if (r.ID === id) { r.Status = 'Belum claim'; r.NoRujukan = ''; r.TarikhHantar = ''; r.TarikhBayar = ''; } });
    busy(false); closeSheet(); renderAll(); toast('Dikembalikan ke Belum claim');
  }).catch(fail);
}

    return r.Status === 'Belum claim' && r.Entiti === c.entiti && r.EmelClaimant === c.claimant &&
      (!c.dari || r.Tarikh >= c.dari) && (!c.hingga || r.Tarikh <= c.hingga);
  }).sort(function (a, b) { return a.Tarikh.localeCompare(b.Tarikh) || String(a.Dicipta).localeCompare(String(b.Dicipta)); });
}
function setC(k, v) { S.claim[k] = v; S.claim.sel = null; if (k === 'entiti') store('claimEntiti', v); renderClaim(); }

function renderClaimTotal() {

function generateClaim() {
  var c = S.claim, d = S.d;
  var rows = claimRows().filter(function (r) { return c.sel[r.ID]; });
  if (!rows.length) return;
  var e = ent(c.entiti), u = userBy(c.claimant);
  var total = Math.round(rows.reduce(function (s, r) { return s + Number(r.Amaun); }, 0) * 100) / 100;
  var dari = c.dari || rows[0].Tarikh, hingga = c.hingga || rows[rows.length - 1].Tarikh;
  if (!confirm('Jana borang ' + e.nama + ' untuk ' + u.nama + ': ' + rows.length + ' rekod, ' + rm(total) + '?\n\nRekod akan ditanda "Dah claim".')) return;
  if (typeof PDFLib === 'undefined') return toast('Pustaka PDF gagal dimuatkan. Semak internet dan cuba lagi.', 5000);
  var ref, receipts = {};
  busy(true, 'Menyediakan no rujukan...');
  api('apiNextRef', e.kod, u.email, hingga).then(function (r) {
    ref = r;
    var withFile = rows.filter(function (x) { return x.ResitFileId; }), done = 0, queue = withFile.slice();
    busy(true, 'Mengambil resit 0/' + withFile.length + '...');
    function worker() {
      var x = queue.shift(); if (!x) return Promise.resolve();
      return api('apiGetReceipt', x.ResitFileId).then(function (f) { receipts[x.ID] = f; done++; busy(true, 'Mengambil resit ' + done + '/' + withFile.length + '...'); return worker(); });
    }
    return Promise.all([worker(), worker(), worker()]);
  }).then(function () {
    busy(true, 'Menjana PDF...');
    return buildClaimPdf({ entiti: e, claimant: u, ref: ref, dari: dari, hingga: hingga, rows: rows, receipts: receipts, total: total, today: d.today,
      pelulus: d.pelulus, taip: d.tandatanganTaip });
  }).then(function (bytes) {
    busy(true, 'Menyimpan ke Drive...');
    return api('apiSaveClaim', { noRujukan: ref, entiti: e.kod, emelClaimant: u.email, dari: dari, hingga: hingga, ids: rows.map(function (r) { return r.ID; }), jumlah: total }, u8ToB64(bytes));
  }).then(function (res) {
    return load(true).then(function () { showClaimDone(ref, res, total, rows.length); });
  }).catch(fail);
}

    '<div class="card center"><div class="small muted">' + esc(ref) + '</div><div class="total">' + rm(total) + '</div>' +
    '<div class="small muted">' + n + ' rekod ditanda "Dah claim". Borang + resit disimpan dalam folder Drive "Borang".</div></div>' +
    '<a href="' + esc(res.url) + '" target="_blank" style="text-decoration:none"><button class="primary block">Buka PDF</button></a>' +
    '<p class="small muted center">Dari Drive, tekan Kongsi untuk hantar melalui WhatsApp/emel, atau cetak.</p>' +

function u8ToB64(u8) {

/* =================================================================== */
/* Penjana PDF: ikut borang SEBENAR yang boss muat naik                 */

function hexRgb(h) { h = h.replace('#', ''); return PDFLib.rgb(parseInt(h.substr(0, 2), 16) / 255, parseInt(h.substr(2, 2), 16) / 255, parseInt(h.substr(4, 2), 16) / 255); }
function fetchFont(doc, url, fallback) {
  if (typeof fontkit === 'undefined') return doc.embedFont(fallback);
  doc.registerFontkit(fontkit);
  return fetch(url).then(function (r) { if (!r.ok) throw new Error('font'); return r.arrayBuffer(); })
    .then(function (b) { return doc.embedFont(b, { subset: true }); })
    .catch(function () { return doc.embedFont(fallback); });
}
function cleanTxt(t) {
  t = String(t == null ? '' : t).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/\r/g, '').replace(/\t/g, ' ');
  return t.replace(/[^\n\x20-\x7E -ÿ]/g, '?');
}
function wrapTxt(text, font, size, maxW) {
  var out = [];
  cleanTxt(text).split('\n').forEach(function (para) {
    var words = para.split(/\s+/).filter(String), cur = '';
    if (!words.length) return;
    words.forEach(function (w) {
      var t = cur ? cur + ' ' + w : w;
      if (font.widthOfTextAtSize(t, size) <= maxW) { cur = t; return; }
      if (cur) out.push(cur);
      while (font.widthOfTextAtSize(w, size) > maxW && w.length > 1) {
        var k = w.length; while (k > 1 && font.widthOfTextAtSize(w.slice(0, k), size) > maxW) k--;
        out.push(w.slice(0, k)); w = w.slice(k);
      }
      cur = w;
    });
    if (cur) out.push(cur);
  });
  return out.length ? out : [''];
}
function kmStr(km) { var n = Math.round(Number(km) * 100) / 100; return n % 1 === 0 ? n.toFixed(1) : String(n); }

// Sediakan lampiran: {r, n, kind:'img'|'pdf'|'bad', full, thumb, bytes}
function prepReceipts(o, gray) {
  var list = [], n = 0, chain = Promise.resolve();
  o.rows.forEach(function (r) {
    var f = o.receipts[r.ID]; if (!f) return;
    var no = ++n, mt = (f.mimeType || '').toLowerCase();
    chain = chain.then(function () {
      if (mt === 'application/pdf') { list.push({ r: r, n: no, kind: 'pdf', bytes: b64ToU8(f.data) }); return; }
      return loadImg('data:' + (mt || 'image/jpeg') + ';base64,' + f.data).then(function (img) {
        list.push({ r: r, n: no, kind: 'img', full: dataUrlToU8(drawToJpeg(img, 1600, 0.8, gray)), thumb: dataUrlToU8(drawToJpeg(img, 500, 0.75, false)) });
      }).catch(function () { list.push({ r: r, n: no, kind: 'bad' }); });
    });
  });
  return chain.then(function () { return list; });
}

function buildClaimPdf(o) { return o.entiti.layout === 'perseni' ? buildPerseni(o) : buildPM(o); }

/* ---------- Layout PM (juga FullStag) ---------- */
function buildPM(o) {
  var P = PDFLib, W = 595.28, H = 841.89, L = 45.4, R = 549.9;
  var X = [45.4, 71.2, 133.9, 225.2, 392.8, 484.0, 549.9];
  var BLACK = P.rgb(0, 0, 0), WHITE = P.rgb(1, 1, 1), GRID = P.rgb(0.62, 0.62, 0.62), BRAND = hexRgb(o.entiti.warna || '#F47B20');
  var doc, f, fs, pg, lamp;
  function T(top) { return H - top; }
  function text(t, x, base, size, font, color, align) {
    t = cleanTxt(t).replace(/\n/g, ' ');
    var w = font.widthOfTextAtSize(t, size);
    if (align === 'right') x -= w; else if (align === 'center') x -= w / 2;
    pg.drawText(t, { x: x, y: T(base), size: size, font: font, color: color || BLACK });

  function vline(x, top, bottom, color, th) { pg.drawLine({ start: { x: x, y: T(top) }, end: { x: x, y: T(bottom) }, thickness: th || 0.5, color: color || GRID }); }

  function T(top) { return H - top; }

    var chain = Promise.resolve();
    lamp.forEach(function (x) { if (x.kind === 'img') chain = chain.then(function () { return doc.embedJpg(x.thumb).then(function (im) { imgs[x.r.ID] = im; }); }); });
    return chain.then(function () {
      pg = doc.addPage([W, H]);

      if (ftr) pg.drawImage(ftr, { x: 0.9, y: T(842), width: 594.7, height: 27 });
      var bottomLimit = 805;

          if (lx) paras.push(['(Lampiran ' + lx.n + ')', fi]);

        if (thumb) pg.drawImage(thumb.im, { x: X[3] + 6.8, y: T(y + 6 + thumb.h), width: thumb.w, height: thumb.h });
        var iy = base;
        info.forEach(function (p, k) {

        text(Number(r.Amaun).toFixed(2), X[4] + 5.2, base, 10, fr);
        y += h;
      });
      for (var e = 0; e < 3 && y + 17 + 34.5 < bottomLimit; e++) { for (var c2 = 0; c2 < 5; c2++) cellBox(X[c2], X[c2 + 1], y, y + 17); y += 17; }

    '<div class="grow"><label>Hingga</label><input type="date" id="exHingga" value="' + d.today + '"></div></div>' +
    '<label>Entiti</label><select id="exEnt"><option value="">Semua</option>' + d.entiti.map(function (e) { return '<option value="' + e.kod + '">' + esc(e.nama) + '</option>'; }).join('') + '</select>' +
    '<div style="height:10px"></div><button class="block" onclick="exportCsv()">Eksport ke Drive</button><div id="exOut" class="small" style="margin-top:8px"></div></div>';

  if (d.sheetUrl) h += '<div class="card"><a href="' + esc(d.sheetUrl) + '" target="_blank">Buka Google Sheet data</a></div>';
  h += '<div class="card small"><b>Pasang di skrin utama</b><br>iPhone: buka dalam Safari &gt; butang Kongsi &gt; Add to Home Screen.<br>Android: Chrome &gt; menu &#8942; &gt; Add to Home screen / Install app.</div>';
  h += '<div class="card"><button class="block" onclick="logout()">Log keluar</button><div class="small muted" style="margin-top:6px">Log masuk kekal 60 hari di telefon ini.</div></div>';
  $('tab-tetapan').innerHTML = h;
}
function saveProfile() {
  busy(true, 'Menyimpan profil...');
  api('apiUpdateMe', $('pfNama').value.trim(), $('pfPenuh').value.trim(), $('pfJaw').value.trim())
    .then(function () { return load(true); }).then(function () { toast('Profil disimpan'); }).catch(fail);
}
function addUser() {
  var e = $('nuEmail').value.trim(), n = $('nuNama').value.trim(), k = $('nuKod').value.trim();
  if (!e || !n || !k) return toast('Isi emel, nama dan kod.');
  busy(true, 'Menambah pengguna...');
  api('apiAddUser', e, n, k, $('nuPenuh').value.trim(), $('nuJaw').value.trim()).then(function () { return load(true); }).then(function () { toast(n + ' ditambah'); }).catch(fail);
}
function saveKadar() {
  var v = Number($('setKadar').value.replace(',', '.'));
  if (!(v > 0)) return toast('Kadar tidak sah.');
  if (!confirm('Tukar kadar perbatuan kepada RM' + v.toFixed(2) + '/km? Rekod lama kekal dengan kadar asal.')) return;
  saveSetting('kadar_km', String(v));
}
function savePelulus() {
  busy(true);
  api('apiSetSetting', 'perseni_pelulus_nama', $('setPlN').value).then(function () { return api('apiSetSetting', 'perseni_pelulus_jawatan', $('setPlJ').value); })
    .then(function () { return load(true); }).then(function () { toast('Pelulus disimpan'); }).catch(fail);
}
function saveSetting(k, v) {
  busy(true);
  api('apiSetSetting', k, v).then(function () { return load(true); }).then(function () { toast('Tetapan disimpan'); }).catch(fail);
}
function exportCsv() {
  busy(true, 'Mengeksport...');
  api('apiExportCsv', { dari: $('exDari').value, hingga: $('exHingga').value, entiti: $('exEnt').value }).then(function (r) {
    busy(false); $('exOut').innerHTML = r.count + ' rekod. <a href="' + esc(r.url) + '" target="_blank">Buka ' + esc(r.name) + '</a>';
  }).catch(fail);
}

/* =================================================================== */
/* Kucing jalan-jalan + bunyi meow (disintesis, tiada fail audio)       */
/* =================================================================== */
function walkCatSvg(variant, mood) {
  var fill = variant === 'kelabu' ? '#a3a3a3' : '#ffffff', far = variant === 'kelabu' ? '#8e8e8e' : '#ece4dd';
  function leg(cls, x, f) { return '<g class="leg ' + cls + '"><rect x="' + x + '" y="56" width="13" height="26" rx="6.5" fill="' + f + '" stroke="' + INK + '" stroke-width="4"/></g>'; }
  var patch = variant === 'calico' ? '<ellipse cx="46" cy="50" rx="13" ry="9" fill="#c4956c"/><ellipse cx="68" cy="62" rx="8" ry="6" fill="#4a3b36" opacity=".8"/>' : '';
  return '<svg viewBox="0 0 130 96" xmlns="http://www.w3.org/2000/svg">' +
    '<g class="tail"><path d="M32 54 C14 52 8 34 16 22" fill="none" stroke="' + INK + '" stroke-width="12" stroke-linecap="round"/>' +
    '<path d="M32 54 C14 52 8 34 16 22" fill="none" stroke="' + fill + '" stroke-width="5" stroke-linecap="round"/></g>' +
    leg('l1', 32, far) + leg('l2', 64, far) +
    '<g class="bod"><ellipse cx="56" cy="57" rx="31" ry="19" fill="' + fill + '" stroke="' + INK + '" stroke-width="4"/></g>' +
    leg('l3', 39, fill) + leg('l4', 71, fill) +
    '<g class="bod"><ellipse cx="56" cy="57" rx="28" ry="16" fill="' + fill + '"/>' + patch + '</g>' +
    '<g class="bod"><g transform="translate(62,2) scale(0.55)">' + catFace(variant, mood) + '</g></g>' +
    '</svg>';
}
var PAW = '<svg viewBox="0 0 20 20"><g fill="#4a3b36"><ellipse cx="10" cy="13" rx="5" ry="4.2"/><circle cx="4" cy="7.5" r="2.2"/><circle cx="8" cy="4" r="2.2"/><circle cx="12" cy="4" r="2.2"/><circle cx="16" cy="7.5" r="2.2"/></g></svg>';
var AC = null, lastMeow = 0;
function unlockAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
document.addEventListener('touchend', unlockAudio, { passive: true });
document.addEventListener('click', unlockAudio);
function meowSound(p) {
  if (store('bunyi') === '0' || !AC || AC.state !== 'running') return;
  p = p || (0.9 + Math.random() * 0.3);
  var t = AC.currentTime + 0.02, o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(480 * p, t); o.frequency.linearRampToValueAtTime(820 * p, t + 0.16);
  o.frequency.linearRampToValueAtTime(900 * p, t + 0.3); o.frequency.exponentialRampToValueAtTime(430 * p, t + 0.78);
  f.type = 'bandpass'; f.Q.value = 2.5;
  f.frequency.setValueAtTime(700, t); f.frequency.linearRampToValueAtTime(1900, t + 0.22); f.frequency.linearRampToValueAtTime(900, t + 0.78);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.07); g.gain.setValueAtTime(0.3, t + 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.82);
  lfo.frequency.value = 7; lg.gain.value = 18 * p; lfo.connect(lg); lg.connect(o.frequency);
  o.connect(f); f.connect(g); g.connect(AC.destination);
  o.start(t); lfo.start(t); o.stop(t + 0.85); lfo.stop(t + 0.85);
  lastMeow = Date.now();
}
var WK = { x: -90, dir: 1, state: 'walk', until: 0, last: 0, pawAt: 0, el: null };
function walkerOn() { return store('kucing') !== '0'; }
function initWalker() {
  var el = $('walker'); WK.el = el;
  var i = S.d ? Math.max((S.d.allUsers || S.d.users).findIndex(function (x) { return x.email === S.d.me.email; }), 0) : 0;
  el.innerHTML = '<div class="say" id="say"></div>' + walkCatSvg(['putih', 'calico', 'kelabu'][i % 3], 'dot');
  el.querySelector('svg').addEventListener('click', function (ev) { ev.stopPropagation(); unlockAudio(); setTimeout(petCat, 30); });
  el.classList.toggle('off', !walkerOn());
  if (!WK.started) { WK.started = true; WK.until = performance.now() + 5000; requestAnimationFrame(walkerTick); }
}
function catSay(txt, ms) {
  var b = $('say'); if (!b) return;
  b.textContent = txt; b.classList.add('show');
  clearTimeout(b._h); b._h = setTimeout(function () { b.classList.remove('show'); }, ms || 2200);
}
function hearts(x, y, n) {
  for (var i = 0; i < (n || 3); i++) (function (k) {
    setTimeout(function () {
      var h = document.createElement('div'); h.className = 'heart'; h.innerHTML = '&#10084;';
      h.style.left = (x + (Math.random() * 40 - 20)) + 'px'; h.style.top = (y + (Math.random() * 10)) + 'px';
      document.body.appendChild(h); setTimeout(function () { h.remove(); }, 1300);
    }, k * 140);
  })(i);
}
function petCat() {
  var r = WK.el.getBoundingClientRect();
  WK.el.classList.remove('jump'); void WK.el.offsetWidth; WK.el.classList.add('jump');
  hearts(r.left + r.width / 2 - 8, r.top, 3);
  catSay(['Meow!', 'Miau~', 'Purr purr...', 'Nyaa~ ♡'][Math.floor(Math.random() * 4)]);
  meowSound(1.1);
  WK.state = 'sit'; WK.until = performance.now() + 2500;
}
function belumTotal() {
  if (!S.d) return 0;
  return S.d.rekod.filter(function (r) { return r.Status === 'Belum claim'; }).reduce(function (s, r) { return s + Number(r.Amaun); }, 0);
}
function idleLine() {
  var b = belumTotal(), lines = ['Meow~', 'Miau!', 'Nyaa~', 'Purr...', 'Simpan resit tau!'];
  if (b > 0) lines.push('Ada ' + rm(b) + ' belum claim!');
  var day = +String(S.d ? S.d.today : '').slice(8, 10);
  if (day >= 20 && day <= 25) lines.push('Dah dekat 25hb, jom claim!');
  return lines[Math.floor(Math.random() * lines.length)];
}
function walkerTick(now) {
  requestAnimationFrame(walkerTick);
  var el = WK.el; if (!el || el.classList.contains('off')) { WK.last = now; return; }
  var dt = Math.min(0.1, (now - (WK.last || now)) / 1000); WK.last = now;
  var maxX = window.innerWidth - 84, reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce && WK.x < 4) WK.x = 12;
  if (now > WK.until) {
    if (WK.state === 'walk' || reduce) {
      WK.state = 'sit'; WK.until = now + 2500 + Math.random() * 3500;
      if (Math.random() < 0.45) { catSay(idleLine(), 2600); if (Date.now() - lastMeow > 25000) meowSound(); }
    } else {
      WK.state = 'walk'; WK.until = now + 4000 + Math.random() * 6000;
      if (Math.random() < 0.35) WK.dir *= -1;
    }
  }
  if (WK.state === 'walk' && !reduce) {
    WK.x += WK.dir * 42 * dt;
    if (WK.x > maxX) { WK.x = maxX; WK.dir = -1; }
    if (WK.x < 4 && WK.dir < 0) { WK.x = 4; WK.dir = 1; }
    if (Math.abs(WK.x - WK.pawAt) > 26 && WK.x > 0) {
      WK.pawAt = WK.x;
      var p = document.createElement('div'); p.className = 'paw'; p.innerHTML = PAW;
      p.style.left = (WK.x + (WK.dir > 0 ? 18 : 52)) + 'px';
      p.style.bottom = 'calc(' + (57 + (Math.round(WK.x / 26) % 2) * 4) + 'px + env(safe-area-inset-bottom, 0px))';
      p.style.transform = 'rotate(' + (WK.dir > 0 ? 90 : -90) + 'deg)';
      document.body.appendChild(p); setTimeout(function () { p.remove(); }, 2700);
    }
  }
  el.classList.toggle('walking', WK.state === 'walk' && !reduce);
  el.classList.toggle('sit', WK.state !== 'walk' || reduce);
  el.classList.toggle('left', WK.dir < 0);
  el.style.transform = 'translateX(' + Math.round(WK.x) + 'px)';
}
function setPref(k, on) {
  store(k, on ? '1' : '0');
  if (k === 'kucing') $('walker').classList.toggle('off', !on);
  if (k === 'bunyi' && on) { unlockAudio(); setTimeout(function () { meowSound(1); }, 60); }
}

$('loadCat').innerHTML = catSvg('putih', 'happy');
initWalker();
start();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('sw', e); }); });
}
